<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Caos ao Controle</title>

<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s){
if(f.fbq)return;
n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;
n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];
t=b.createElement(e);t.async=!0;
t.src='https://connect.facebook.net/en_US/fbevents.js';
s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s);
}(window, document,'script');

fbq('init', '922268493776329');
fbq('track', 'PageView');
</script>

<noscript>
<img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=922268493776329&ev=PageView&noscript=1"/>
</noscript>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:Arial,Helvetica,sans-serif;
}
video{
  width:100%;
  height:100%;
  object-fit:cover;
}
#botao{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#16a34a;
  color:white;
  text-decoration:none;
  padding:18px 30px;
  border-radius:50px;
  font-size:20px;
  font-weight:bold;
  display:none;
  z-index:999;
  animation:pulsar 1.5s infinite;
}
@keyframes pulsar{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.08);}
  100%{transform:translateX(-50%) scale(1);}
}
</style>
</head>

<body>

<video id="video" controls autoplay playsinline>
  <source src="video.mp4" type="video/mp4">
</video>

<a id="botao"
   href="https://pay.hotmart.com/M106030580M"
   target="_blank">
  QUERO ACESSAR AGORA
</a>

<script>
const video = document.getElementById("video");
const botao = document.getElementById("botao");

// Esconde o botão ao carregar
botao.style.display = "none";

// Mostra apenas nos últimos 20 segundos
video.addEventListener("timeupdate", () => {
  const faltam = video.duration - video.currentTime;

  if (faltam <= 20) {
    botao.style.display = "block";
  } else {
    botao.style.display = "none";
  }
});

// Pixel quando clicar no botão
botao.addEventListener("click", () => {
  fbq('track', 'InitiateCheckout');
});
</script>

</body>
</html>
