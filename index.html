<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Caos ao Controle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:black;font-family:Arial,Helvetica,sans-serif}
video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover}
.botao{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
background:#16a34a;color:#fff;text-decoration:none;padding:18px 30px;
border-radius:50px;font-size:20px;font-weight:bold;display:none;
animation:pulsar 1.5s infinite;z-index:999}
@keyframes pulsar{
0%{transform:translateX(-50%) scale(1)}
50%{transform:translateX(-50%) scale(1.08)}
100%{transform:translateX(-50%) scale(1)}
}
</style>
</head>
<body>
<video id="video" controls autoplay playsinline>
  <source src="video.mp4" type="video/mp4">
</video>

<a id="botao" class="botao" href="https://pay.hotmart.com/M106030580M" target="_blank">
QUERO ACESSAR AGORA
</a>

<script>
const video=document.getElementById("video");
const botao=document.getElementById("botao");

video.addEventListener("loadedmetadata",()=>botao.style.display="none");

video.addEventListener("timeupdate",()=>{
  const restante=video.duration-video.currentTime;
  botao.style.display=restante<=20?"block":"none";
});
</script>
</body>
</html>
