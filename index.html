<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do Caos ao Controle – Descubra por onde começar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--panel:#121212;--line:#333;--text:#f2f0ec;--muted:#a9abb2;--accent:#f2f0ec;--on-accent:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:400 18px/1.55 "Source Sans 3",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:560px;padding:40px 22px 56px;display:flex;flex-direction:column;justify-content:center}
h1,h2{font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;line-height:1.15;margin:0 0 14px}
h1{font-size:clamp(24px,6.5vw,32px);font-weight:800;letter-spacing:-.01em;margin-bottom:28px}
h2{font-size:clamp(24px,6.5vw,32px);font-weight:800}
p{margin:0 0 22px;max-width:60ch}
.muted{color:var(--muted)}
.step[hidden]{display:none}
[hidden]{display:none!important}
.bar{height:3px;background:var(--line);margin-bottom:36px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s}
label{display:block;font-weight:600;margin-bottom:8px}
input[type=text]{width:100%;font:inherit;font-size:20px;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:16px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
button,.btn{font:600 18px/1 Montserrat,Arial,sans-serif;cursor:pointer;text-decoration:none;display:block;text-align:center;border-radius:6px;padding:18px 20px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);width:100%}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.opts{display:grid;gap:12px;margin-bottom:22px}
.opt{background:var(--panel);color:var(--text);border:2px solid var(--line);text-align:left;font:600 17px/1.35 "Source Sans 3",sans-serif;padding:18px}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.two{grid-template-columns:1fr 1fr}
.quote{border-left:4px solid var(--accent);padding:4px 0 4px 18px;margin:0 0 22px;font-size:21px;line-height:1.45}
.tips{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:22px;max-height:300px;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:var(--muted) var(--panel)}
.tips .quote{margin-bottom:16px;font-size:20px}
.tips p{margin:0 0 14px}.tips p:last-child{margin:0;font-size:32px;line-height:1;color:var(--muted)}
.back{background:none;border:0;color:var(--muted);width:auto;padding:14px 0 0;font:400 16px "Source Sans 3",sans-serif;text-decoration:underline}
.tips .blur{filter:blur(6px);user-select:none;pointer-events:none}
.tips .blur p,.tips .blur p:last-child{font-size:18px;line-height:1.55;color:var(--text);margin:0 0 14px}
.price{font:800 clamp(44px,13vw,64px)/1 Montserrat,Arial,sans-serif;margin:0 0 6px;text-align:center}
#pay p.muted{text-align:center;margin-bottom:18px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
<div class="bar" aria-hidden="true"><i id="prog"></i></div>

<section class="step" id="s0">
  <h1>Responda essas 3 perguntas e veja como começar a sua mudança.</h1>
  <button type="button" id="start">Começar</button>
</section>

<section class="step" id="s1" hidden>
  <h2>Qual é o seu nome?</h2>
  <label for="nome" class="muted">Digite seu nome</label>
  <p><input type="text" id="nome" autocomplete="given-name" maxlength="40"></p>
  <button type="button" id="n1" disabled>Continuar</button>
</section>

<section class="step" id="s2" hidden>
  <h2 id="t2">Qual é o seu sexo?</h2>
  <div class="opts two" id="sexo">
    <button type="button" class="opt" data-v="m" aria-pressed="false">Masculino</button>
    <button type="button" class="opt" data-v="f" aria-pressed="false">Feminino</button>
  </div>
  <button type="button" id="n2" disabled>Continuar</button>
  <button type="button" class="back" data-back="1">Voltar</button>
</section>

<section class="step" id="s3" hidden>
  <h2>Selecione uma das opções abaixo que você mais necessita</h2>
  <div class="opts" id="prob">
    <button type="button" class="opt" data-k="emagrecer" aria-pressed="false">Quero emagrecer e ficar definido</button>
    <button type="button" class="opt" data-k="disciplina" aria-pressed="false">Quero ter mais disciplina</button>
    <button type="button" class="opt" data-k="vicios" aria-pressed="false">Quero vencer vícios</button>
    <button type="button" class="opt" data-k="paz" aria-pressed="false">Quero ter paz e clareza mental</button>
    <button type="button" class="opt" data-k="outro" aria-pressed="false">Outro</button>
  </div>
  <button type="button" id="n3" disabled>Ver minha dica</button>
  <button type="button" class="back" data-back="2">Voltar</button>
</section>

<section class="step" id="s4" hidden>
  <h2 id="rt"></h2>
  <p class="muted" id="rs"></p>
  <div class="tips" id="rtips" tabindex="0" aria-label="Dicas do guia, role para ler"></div>
  <button type="button" id="more">Ver mais</button>
  <div id="pay" hidden>
    <p class="price">R$ 59,90</p>
    <p class="muted">Acesse o guia Do Caos ao Controle completo.</p>
    <a class="btn" id="cta" href="https://pay.hotmart.com/M106030580M?checkoutMode=10" target="_blank" rel="noopener">Acessar</a>
  </div>
  <button type="button" class="back" data-back="3">Escolher outra opção</button>
</section>
</main>

<script>
var CHECKOUT="https://pay.hotmart.com/M106030580M?checkoutMode=10";
var DICAS={
 emagrecer:{t:"emagrecer e ficar definido",q:"O objetivo é construir um estilo de vida mais saudável e sustentável — não uma dieta temporária.",
  tips:["Melhorar a alimentação melhora energia, produtividade, sono e saúde.","Priorize alimentos naturais: frutas e legumes frescos, carnes de qualidade e comidas menos industrializadas.","Reduza o açúcar industrial. Muitas pessoas percebem melhora no humor, na disposição e na composição corporal.","Coma frutas regularmente, beba bastante água e evite exageros frequentes.","Na corrida, comece com 5 km na primeira semana e descanse no segundo dia para evitar lesões.","Na calistenia, comece com flexões adaptadas e evolua gradualmente.","Constância antes de intensidade. Sempre."]},
 disciplina:{t:"ter mais disciplina",q:"Disciplina começa quando a vontade acaba.",
  tips:["Toda grande conquista exige renúncias. Nem sempre você terá vontade, motivação ou conforto.","A motivação é temporária. O propósito é permanente. É ele que te levanta quando tudo dentro de você quer ficar deitado.","Defina um treino consistente, como “5 vezes na semana, 100 flexões por dia”.","A evolução física acontece na soma de todos os dias em que você escolheu aparecer.","Cada decisão de hoje molda quem você será amanhã. O agora é o único momento que você controla.","Transformação verdadeira acontece em silêncio, longe dos aplausos, na consistência diária."]},
 vicios:{t:"vencer vícios",q:"Muitas vezes recorremos ao vício para fugir de alguma realidade desconfortável. Mas, quando o efeito passa, a realidade continua ali.",
  tips:["O vício faz a pessoa buscar prazer imediato sem pensar nas consequências para a saúde física, mental e financeira.","Sem os vícios, você ainda pode rir, ser feliz, comer bem, trabalhar, crescer e se divertir.","Na verdade, a ausência deles tende a melhorar a sua vida.","Quando você nega o que destrói sua disciplina, surge uma sensação melhor que o prazer imediato: a de dever cumprido.","“Eu paro quando quiser.” Mas você realmente quer parar? Isso já é o vício agindo.","A felicidade real nasce do equilíbrio e da consciência."]},
 paz:{t:"ter paz e clareza mental",q:"Busque ficar mais sozinho para organizar seus pensamentos e descobrir quem você realmente é quando ninguém está olhando.",
  tips:["Quem encontra paz na própria companhia não depende da aprovação dos outros o tempo todo.","Reduza o consumo inútil: ficar observando a vida dos outros nos stories, páginas de fofoca e conteúdos fúteis.","Enquanto estiver sozinho, organize suas tarefas, decida o que deve fazer e pense em estratégias para melhorar sua conduta.","Faça exame de consciência.","Existe uma paz que dinheiro nenhum compra: a paz de saber que você fez o certo.","Você controla apenas a si mesmo. Essa é a sua arena."]},
 outro:{t:"mudar de vida",q:"Você nunca estará atrasado para melhorar sua vida.",
  tips:["Sempre existe tempo para recomeçar, aprender e construir uma nova versão de si mesmo.","Evolução física: mova seu corpo, treine, corra, lute, construa força.","Evolução mental: tenha disciplina, controle seus vícios, organize seus pensamentos.","Evolução espiritual: mantenha fé nos seus objetivos e continue caminhando, mesmo devagar.","Não julgue o caminho dos outros. Use essa energia para melhorar a própria vida.","Uma vida diferente começa com decisões diferentes."]}
};
var st={nome:"",sexo:"",prob:""};
var $=function(i){return document.getElementById(i)};
function show(n){
  for(var i=0;i<5;i++){$("s"+i).hidden=(i!==n)}
  $("prog").style.width=(n*25)+"%";
  if(n===1){$("nome").focus()}
  window.scrollTo(0,0);
}
function pick(group,attr,btn){
  var all=group.querySelectorAll(".opt");
  for(var i=0;i<all.length;i++){all[i].setAttribute("aria-pressed","false")}
  btn.setAttribute("aria-pressed","true");
  return btn.getAttribute(attr);
}
$("start").onclick=function(){show(1)};
$("nome").oninput=function(){st.nome=this.value.trim();$("n1").disabled=!st.nome};
$("nome").onkeydown=function(e){if(e.key==="Enter"&&st.nome){$("n1").click()}};
$("n1").onclick=function(){$("t2").textContent=st.nome+", qual é o seu sexo?";show(2)};
$("sexo").onclick=function(e){var b=e.target.closest(".opt");if(!b)return;st.sexo=pick(this,"data-v",b);$("n2").disabled=false};
$("n2").onclick=function(){show(3)};
$("prob").onclick=function(e){var b=e.target.closest(".opt");if(!b)return;st.prob=pick(this,"data-k",b);$("n3").disabled=false};
$("n3").onclick=function(){
  var d=DICAS[st.prob];
  var ola=st.sexo==="f"?"Bem-vinda":"Bem-vindo";
  $("rt").textContent=st.nome+", vamos começar por aqui";
  $("rs").textContent=ola+". Você quer "+d.t+". Role para ler as dicas do guia Do Caos ao Controle:";
  var h=$("rtips");h.innerHTML="";h.scrollTop=0;
  var q=document.createElement("blockquote");q.className="quote";q.textContent="“"+d.q+"”";h.appendChild(q);
  d.tips.forEach(function(t){var p=document.createElement("p");p.textContent=t;h.appendChild(p)});
  var e=document.createElement("p");e.textContent="…";e.setAttribute("aria-hidden","true");h.appendChild(e);
  $("more").hidden=false;$("pay").hidden=true;
  show(4);
};
$("more").onclick=function(){
  var h=$("rtips");
  if(h.lastChild&&h.lastChild.getAttribute("aria-hidden")){h.removeChild(h.lastChild)}
  var b=document.createElement("div");b.className="blur";b.setAttribute("aria-hidden","true");
  ["Dentro do tatame, dinheiro, aparência e status perdem importância. Todos aprendem igualmente através do treino.","A internet mostra vitrines, não bastidores. Você vê conquistas, mas não vê dores, dificuldades e sacrifícios.","A raiva pode destruir ou fortalecer alguém. Quando direcionada corretamente, vira combustível para treino, evolução e disciplina.","Muitas pessoas lembrarão apenas dos seus erros antigos. Mas transformação verdadeira acontece em silêncio.","Uma vida diferente começa com decisões diferentes — e principalmente, renúncias."].forEach(function(t){var p=document.createElement("p");p.textContent=t;b.appendChild(p)});
  h.appendChild(b);
  this.hidden=true;$("pay").hidden=false;
  h.scrollTo({top:h.scrollTop+140,behavior:"smooth"});
  $("pay").scrollIntoView({block:"nearest",behavior:"smooth"});
};
document.querySelectorAll("[data-back]").forEach(function(b){b.onclick=function(){show(+b.getAttribute("data-back"))}});
show(0);
</script>
</body>
</html>
