<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vídeo</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
body{display:flex;align-items:center;justify-content:center}
main{position:relative;width:100%;height:100%}
video{width:100%;height:100%;object-fit:contain}
#cta{display:none;position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
width:min(90%,420px);padding:16px;border:0;border-radius:10px;background:#18b957;
color:#fff;font:bold 18px Arial;text-align:center;text-decoration:none}
#cta.show{display:block}
</style>
</head>
<body>
<main>
<video id="v" controls playsinline preload="metadata">
<source src="./video.mp4" type="video/mp4">
</video>
<a id="cta" href="https://pay.hotmart.com/M106030580M">QUERO ACESSAR AGORA</a>
</main>
<script>
const v=document.getElementById("v"),c=document.getElementById("cta");
v.addEventListener("timeupdate",()=>{if(v.duration-v.currentTime<=20)c.classList.add("show")});
</script>
</body>
</html>
